# Test, creazione dell'exe e (quando SignPath e' configurato) firma.
# Gira su Windows con Windows PowerShell 5.1, come sui PC dei clienti.
name: Build

# Per pubblicare una versione: crea una Release su GitHub (tag v2.3.0, ecc.):
# questa build parte da sola e allega ToolkitHelpDesk.zip e helpdesk-toolkit.zip.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # serve solo per allegare i pacchetti alla release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Strumenti di test (Pester 5 e PSScriptAnalyzer)
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Test con Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $configurazione = New-PesterConfiguration
          $configurazione.Run.Path = './tests'
          $configurazione.Run.Exit = $true
          $configurazione.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configurazione

      - name: Crea ToolkitHelpDesk.exe (compilatore C# di Windows)
        shell: powershell
        run: .\exe\Crea-Exe.ps1

      - name: Prova l'exe (si avvia e si chiude senza mostrare la finestra)
        shell: powershell
        run: |
          $processo = Start-Process -FilePath .\ToolkitHelpDesk.exe -ArgumentList '/verifica' -Wait -PassThru
          if ($processo.ExitCode -ne 0) {
            Get-Content -LiteralPath (Join-Path $env:TEMP 'HelpDeskToolkit-errori.txt') -ErrorAction SilentlyContinue
            throw "ToolkitHelpDesk.exe /verifica: codice di uscita $($processo.ExitCode)"
          }
          (Get-Item .\ToolkitHelpDesk.exe).VersionInfo | Format-List FileVersion, ProductName

      - name: Carica l'exe da firmare
        id: da-firmare
        uses: actions/upload-artifact@v6
        with:
          name: ToolkitHelpDesk-non-firmato
          path: ToolkitHelpDesk.exe
          if-no-files-found: error

      # Attivo solo dopo l'approvazione di SignPath Foundation: in Settings > Secrets and variables > Actions
      # servono il secret SIGNPATH_API_TOKEN e le variabili SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG e SIGNPATH_SIGNING_POLICY_SLUG.
      - name: Firma con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.da-firmare.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmato

      - name: Prepara i pacchetti
        shell: powershell
        run: |
          if (Test-Path -LiteralPath .\firmato\ToolkitHelpDesk.exe) {
            Copy-Item -LiteralPath .\firmato\ToolkitHelpDesk.exe -Destination .\ToolkitHelpDesk.exe -Force
            $firma = Get-AuthenticodeSignature -FilePath .\ToolkitHelpDesk.exe
            if ($firma.Status -ne 'Valid') { throw "Firma non valida: $($firma.Status)" }
            'Firmato da: ' + $firma.SignerCertificate.Subject
          }
          else { 'Exe NON firmato (SignPath non ancora configurato)' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path .\ToolkitHelpDesk.exe -DestinationPath .\dist\ToolkitHelpDesk.zip
          $completo = Join-Path $env:RUNNER_TEMP 'helpdesk-toolkit'
          git archive --format=zip --prefix=helpdesk-toolkit/ -o (Join-Path $env:RUNNER_TEMP 'sorgente.zip') HEAD
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'sorgente.zip') -DestinationPath $env:RUNNER_TEMP
          Copy-Item -LiteralPath .\ToolkitHelpDesk.exe -Destination $completo
          Compress-Archive -Path $completo -DestinationPath .\dist\helpdesk-toolkit.zip
          # impronta dell'exe: per verificarlo e per le eccezioni per hash negli antivirus/EDR
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath .\ToolkitHelpDesk.exe).Hash
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256.txt'), "$hash  ToolkitHelpDesk.exe`r`n")
          "SHA256 di ToolkitHelpDesk.exe: $hash"

      - name: Carica i pacchetti
        uses: actions/upload-artifact@v6
        with:
          name: pacchetti
          path: |
            dist/*.zip
            dist/SHA256.txt
          if-no-files-found: error

      - name: Allega i pacchetti alla release
        if: github.event_name == 'release'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME dist\ToolkitHelpDesk.zip dist\helpdesk-toolkit.zip dist\SHA256.txt --clobber --repo $env:GITHUB_REPOSITORY
          # l'impronta anche nel testo della release, sotto quello scritto da chi l'ha pubblicata
          $hash = ((Get-Content -LiteralPath dist\SHA256.txt -Raw) -split '\s+')[0]
          $note = (@(gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json body --jq .body) -join "`n")
          if ($note -notmatch 'SHA256') {
            $testo = ($note + "`n`n**SHA256 di ToolkitHelpDesk.exe:** ``$hash``").Trim()
            gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --notes $testo
          }
